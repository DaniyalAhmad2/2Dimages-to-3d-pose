name: Windows tests

# The first real Windows signal. We have no Windows machine, so until this
# runs, every Windows claim in this repo is a guess.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Read the interpreter pin
        id: pin
        # `uv.lock` only says >=3.12, so without the pin this job tests on
        # whatever interpreter the runner has newest — while the exe the bundle
        # ships is frozen against .python-version. setup-uv takes a VERSION and
        # has no python-version-file input, and an unknown input is silently
        # ignored, so the file is read here and its absence is a failure.
        run: |
          if (-not (Test-Path .python-version)) {
            throw ".python-version is missing: nothing pins the interpreter"
          }
          $pin = (Get-Content -Raw .python-version).Trim()
          if (-not $pin) {
            throw ".python-version is empty: nothing pins the interpreter"
          }
          Write-Host "testing on Python $pin (.python-version)"
          "python-version=$pin" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ steps.pin.outputs.python-version }}

      - name: Install dependencies from the lockfile
        # --frozen: install exactly what is committed. Resolving here instead
        # would mean CI tests versions the client never receives.
        run: uv sync --frozen --all-groups

      - name: Read the pinned Blender
        id: blender
        # packaging/windows/inputs.json is the only place a Blender version,
        # URL or checksum is written down, and tools/blender_input.py is the
        # only door to it. This job used to restate all three, so bumping
        # Blender meant editing three files correctly.
        run: |
          foreach ($field in @("zip-name", "url", "sha256", "cache-key")) {
            $value = uv run python tools/blender_input.py "--$field"
            if ($LASTEXITCODE -ne 0) { throw "blender_input.py --$field failed" }
            "$field=$value" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/${{ steps.blender.outputs.zip-name }}
          # the key carries the checksum: keyed on the version alone, a
          # corrected hash would keep restoring the old archive from the cache
          # and every run would fail on a file nobody can see
          key: ${{ steps.blender.outputs.cache-key }}

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path .cache | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing `
            -Uri "${{ steps.blender.outputs.url }}" `
            -OutFile ".cache/${{ steps.blender.outputs.zip-name }}"

      - name: Verify Blender
        # ~414 MB over HTTP. Both paths, not just the download: a cached
        # archive is a file some earlier run left behind, and one interrupted
        # mid-download unzips into a blender\ folder missing whatever came
        # after the cut. Deleted on mismatch so the next run cannot restore
        # the same bad bytes forever.
        run: |
          $archive = ".cache/${{ steps.blender.outputs.zip-name }}"
          # -ine, not -ne: inputs.json holds lowercase hex and Get-FileHash
          # returns uppercase, so this comparison must be case-insensitive
          $got = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash
          if ($got -ine "${{ steps.blender.outputs.sha256 }}") {
            Remove-Item -Force $archive
            throw ("checksum mismatch for ${archive}: got $got, expected " +
                   "${{ steps.blender.outputs.sha256 }} " +
                   "(packaging/windows/inputs.json). The archive has been " +
                   "deleted; re-run to fetch it again.")
          }

      - name: Install Blender
        run: |
          Expand-Archive ".cache/${{ steps.blender.outputs.zip-name }}" `
            -DestinationPath .cache/blender -Force
          $dir = (Get-ChildItem .cache/blender -Directory | Select-Object -First 1).FullName
          # config.py finds this via POSE3D_BLENDER; the bundle instead ships it
          # in a blender\ folder beside the exe, which is covered by its own test
          "POSE3D_BLENDER=$dir\blender.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & "$dir\blender.exe" --version

      - name: Cache pose weights
        id: weights-cache
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: rtmlib-weights-balanced-lightweight-halpe-v2

      - name: Fetch pose weights
        run: |
          uv run python tools/fetch_weights.py --out .cache/models
          uv run python tools/fetch_weights.py --out .cache/models --mode lightweight
          "POSE3D_MODELS=${{ github.workspace }}\.cache\models" |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run the test suite
        env:
          # Without these the Blender, rig and weights tests SKIP, and this job
          # goes green having never exercised the export path — the one thing
          # this workflow exists to prove.
          POSE3D_REQUIRE_BLENDER: "1"
          POSE3D_REQUIRE_ASSETS: "1"
          POSE3D_REQUIRE_WEIGHTS: "1"
          # ...but the preview video genuinely cannot be produced here. This
          # runner has no GPU, and unlike Linux there is no software GL to fall
          # back on, so headless Blender fails to find WGL extensions and dies
          # with EXCEPTION_ACCESS_VIOLATION. Everything the client imports —
          # BVH, FBX, the retargeted character — is still required above.
          POSE3D_NO_VIDEO: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -m pytest tests/ -q `
            --ignore=tests/build_demo_project.py

      - name: Self-test from source
        # Same checks the shipped bundle runs, minus the video: a GPU-less
        # runner has no usable GL for EEVEE, which check_video() reports as
        # degraded rather than failing.
        #
        # Deliberately NOT offscreen, unlike the pytest step above. The
        # offscreen platform plugin provides no OpenGL context at all, so the
        # 3D-view check could not pass under it no matter how healthy the build
        # — the check would be unfalsifiable. Letting Qt choose exercises the
        # real path, including the software OpenGL that PySide6 ships for
        # machines whose driver is inadequate.
        env:
          # ...and if even that cannot give a context here, say so rather than
          # fail: this runner has no GPU. A packaging fault — the 3D view
          # missing from the build — still fails. See check_qt_opengl.
          POSE3D_NO_GL: "1"
        run: uv run python -m pose3d.selftest --no-video

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: |
            pose3d-log.txt
          if-no-files-found: ignore
