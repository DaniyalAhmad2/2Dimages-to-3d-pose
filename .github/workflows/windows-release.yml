name: Windows release

# Publishes the .zip the client downloads. Everything that BUILDS and PROVES
# that zip lives in .github/actions/windows-bundle, shared verbatim with
# windows-bundle.yml — so the archive attached to a release is one that has
# already been extracted into a client-shaped path and self-tested from there,
# by the same steps that gate every pull request.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the bundle to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - id: bundle
        uses: ./.github/actions/windows-bundle
        with:
          python-version-file: .python-version

      - uses: actions/upload-artifact@v4
        # Convenience only — the run page download. NOT the delivery path:
        # each zip is ~655 MB, three of them blew the account's Actions
        # artifact storage quota and this step started failing while the
        # build itself was fine. Release assets (below) do not count against
        # that quota, so a quota failure here must not kill the run.
        continue-on-error: true
        with:
          name: Pose3D-Windows
          path: ${{ steps.bundle.outputs.zip }}
          # quota is the binding constraint, not time
          retention-days: 5
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.zip }}
          generate_release_notes: true
          # A manual dispatch publishes a DRAFT under a synthetic tag name:
          # visible to repo collaborators for testing, no public release and
          # no tag actually created unless someone presses Publish. Real tags
          # (v*) publish for real.
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
